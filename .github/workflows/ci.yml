# Day 5 — run the linter and the tests on every push and pull request.
# GitHub shows the result as a green check (or a red X) on the repo and on each PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # lint first (fast), then tests
      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
